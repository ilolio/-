<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a73e8">
  <title>URL Memo</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- リスト画面 -->
  <div id="list-view" class="view">
    <header>
      <h1>URL Memo</h1>
      <button id="btn-settings" class="header-btn" aria-label="設定">⚙</button>
    </header>
    <div id="memo-list" class="memo-list"></div>
    <div id="empty-state" class="empty-state">
      <p>メモはまだありません</p>
      <p class="sub">右下の＋ボタンで新規作成できます</p>
    </div>
    <button id="btn-new" class="fab" aria-label="新規作成">＋</button>
  </div>

  <!-- 編集画面 -->
  <div id="edit-view" class="view hidden">
    <header>
      <h1 id="edit-title">メモ編集</h1>
    </header>
    <div class="edit-container">
      <textarea id="memo-text" placeholder="メモを入力..."></textarea>
      <div id="char-count" class="char-count hidden"></div>
      <div class="edit-actions">
        <button id="btn-copy" class="action-btn" type="button">コピー</button>
        <button id="btn-share" class="action-btn" type="button">共有</button>
        <button id="btn-post-x" class="action-btn action-btn-x" type="button">Xでポスト</button>
      </div>
      <div class="edit-main-actions">
        <button id="btn-cancel" class="btn btn-secondary" type="button">キャンセル</button>
        <button id="btn-save" class="btn btn-primary" type="button">保存</button>
      </div>
    </div>
  </div>

  <!-- 設定画面 -->
  <div id="settings-view" class="view hidden">
    <header>
      <button id="btn-settings-back" class="header-btn" aria-label="戻る">←</button>
      <h1>設定</h1>
    </header>
    <div class="settings-container">
      <div class="settings-item">
        <div class="settings-item-label">
          <div class="settings-item-title">共有時にテキスト編集画面に移動</div>
          <div class="settings-item-desc">共有されたテキストの編集画面を表示します</div>
        </div>
        <label class="toggle">
          <input type="checkbox" id="setting-edit-on-share">
          <span class="toggle-slider"></span>
        </label>
      </div>
      <div class="settings-item">
        <div class="settings-item-label">
          <div class="settings-item-title">URL後に改行を追加</div>
          <div class="settings-item-desc">共有されたURLの後に改行を挿入します</div>
        </div>
        <label class="toggle">
          <input type="checkbox" id="setting-newline">
          <span class="toggle-slider"></span>
        </label>
      </div>
      <div class="settings-item">
        <div class="settings-item-label">
          <div class="settings-item-title">文字数カウント表示</div>
          <div class="settings-item-desc">メモ編集中に文字数を表示します（X準拠）</div>
        </div>
        <label class="toggle">
          <input type="checkbox" id="setting-charcount">
          <span class="toggle-slider"></span>
        </label>
      </div>
    </div>
    <div class="settings-footer">
      <div id="app-version" class="settings-version"></div>
      <div class="settings-links">
        <a href="https://x.com/ilolio" target="_blank" rel="noopener noreferrer">開発者SNS（質問や意見、感想などもどうぞ）</a>
        <a href="#" id="btn-license">使用ライブラリ</a>
      </div>
    </div>
  </div>

  <!-- クイック共有アクションシート -->
  <div id="quick-share-dialog" class="dialog-overlay hidden">
    <div class="quick-share-sheet">
      <div class="quick-share-preview" id="quick-share-preview"></div>
      <div class="quick-share-actions">
        <button id="btn-quick-share" class="action-btn" type="button">共有</button>
        <button id="btn-quick-post-x" class="action-btn action-btn-x" type="button">Xでポスト</button>
      </div>
      <button id="btn-quick-edit" class="btn btn-secondary quick-share-edit-btn" type="button">テキストを編集</button>
    </div>
  </div>

  <!-- ライセンスモーダル -->
  <div id="license-dialog" class="dialog-overlay hidden">
    <div class="dialog license-dialog">
      <h2 class="license-dialog-title">使用ライブラリ</h2>
      <div class="license-list">
        <div class="license-item">
          <div class="license-item-name">twitter-text</div>
          <div class="license-item-desc">X（Twitter）の文字数カウントに使用</div>
          <a href="https://github.com/twitter/twitter-text/blob/master/LICENSE" target="_blank" rel="noopener noreferrer">Apache License 2.0</a>
        </div>
      </div>
      <div class="dialog-actions">
        <button id="btn-license-close" class="btn btn-secondary" type="button">閉じる</button>
      </div>
    </div>
  </div>

  <!-- トースト通知 -->
  <div id="toast" class="toast hidden"></div>

  <!-- 削除確認ダイアログ -->
  <div id="delete-dialog" class="dialog-overlay hidden">
    <div class="dialog">
      <p>このメモを削除しますか？</p>
      <div class="dialog-actions">
        <button id="btn-delete-cancel" class="btn btn-secondary" type="button">キャンセル</button>
        <button id="btn-delete-confirm" class="btn btn-danger" type="button">削除</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/twitter-text@3.1.0/dist/twitter-text.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
